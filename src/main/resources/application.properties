spring.application.name=teams-platform

# Server Configuration
server.port=8080
server.servlet.context-path=/api/v1

# Database Configuration
spring.datasource.url=jdbc:postgresql://db.ogincdwtgwrjxomjebat.supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=teamsApp@2026
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
# Temporarily disable Hibernate schema validation so Flyway can create the schema at startup.
# For production, set this back to 'validate' after migrations are applied.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# Defer JPA/data-source initialization so Flyway runs before Hibernate validates the schema
spring.jpa.defer-datasource-initialization=true

# Flyway logging for diagnostics
logging.level.org.flywaydb=DEBUG

# JWT Configuration
app.jwt.secret=your-secret-key-change-this-in-production
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# Security Configuration
spring.security.require-ssl=false

# Jackson Configuration
# Removed explicit serialization feature binding for WRITE_DATES_AS_TIMESTAMPS because
# the application's Jackson version/enums do not expose that constant for property binding.
# Rely on Jackson's default behavior or configure ObjectMapper programmatically if needed.
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# Logging Configuration
logging.level.root=INFO
logging.level.com.teams.teams=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# File Upload Configuration
app.file.upload-dir=./storage
app.file.max-size=52428800
app.file.allowed-extensions=pdf,doc,docx,xls,xlsx,ppt,pptx,jpg,jpeg,png,gif,txt,csv

# WebSocket Configuration
spring.websocket.session.timeout=3600000

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

spring.devtools.restart.enabled=false
